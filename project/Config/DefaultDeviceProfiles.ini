; MCReplica -- device profiles.
;
; See ../QUALITY_TIERS.md for the full matrix and the reasoning.
; Project-level override of Engine/Config/BaseDeviceProfiles.ini.
;
;
; WHAT A DEVICE PROFILE CAN AND CANNOT DO ON WINDOWS
; ---------------------------------------------------
; A device profile is a named bag of cvars plus an optional parent. That is
; all it is on Windows. Three things people expect it to do that it does not:
;
;   * It cannot pick a profile by benchmark score. There is no
;     "PerfIndexThresholds_*" key in this file's vocabulary. Those keys are read
;     only from DefaultScalability.ini's [ScalabilitySettings] section, by
;     GConfig->GetSingleLineArray in Scalability.cpp:150-152, and their value
;     is a "<CPU|GPU|Min> t0 t1 t2" array -- not a profile name plus numbers.
;     A "PerfIndexThresholds_Universal=SomeProfile 30 120 400" line here would
;     be inert text.
;
;   * It cannot match on GPU or CPU model. The MatchProfile rules used on
;     Android (SourceType=SRC_GpuFamily and friends) are served by
;     AndroidDeviceProfileSelector. The Windows selector
;     (Engine/Plugins/Runtime/WindowsDeviceProfileSelector) does something much
;     simpler: it returns the platform name, optionally suffixed with the RHI,
;     i.e. "Windows" or "Windows_<RHI>" -- see GetRuntimeDeviceProfileName() in
;     WindowsDeviceProfileSelectorModule.cpp. So the only two profile names the
;     engine will ever hand us on Windows are those two, plus whatever we
;     explicitly activate by name.
;
;   * It therefore cannot be the auto-detection layer. On Windows, automatic
;     tier selection means: benchmark, then apply. That is what
;     Content/Python/apply_quality.py does at startup, against the thresholds
;     in DefaultScalability.ini.
;
; So the division of labour across the three layers is:
;
;   DefaultScalability.ini      what each tier is, and the perf-index
;                               boundaries the engine uses to choose one
;   this file                   the floor: a conservative default for a
;                               machine that never benchmarks, and named
;                               profiles the user or a script can select
;   apply_quality.py            the actual runtime decision, plus the
;                               persistent user override
;
;
; THE DEFAULT IS DELIBERATELY MEDIUM
; ----------------------------------
; A cooked build starts every scalability group at 3 (Epic) because nothing
; matched a profile. Epic on this map means full view distance over ~1.6 M
; HISM instances, Lumen, and a 2 GB streaming pool -- on a machine whose
; memory we do not know. Medium is the honest floor: it holds frame rate on a
;  GTX 1650 and a discrete GPU with 8 GB can raise it in one click.
;
; Everything here is SetByDeviceProfile, which is priority 6 in the engine's
; cvar precedence table -- above scalability (2) and below the console (11).
; So a tier applied from Python or typed in the console still wins, which is
; exactly the layering we want.


[DeviceProfiles]
; The engine reads the list of valid profiles from this array before it will
; honour any "[Name DeviceProfile]" section in this file. Declaring a section
; without declaring it here is the most common way a device profile silently
; does nothing.
+DeviceProfileNameAndTypes=MCReplica_Low,Windows
+DeviceProfileNameAndTypes=MCReplica_Medium,Windows
+DeviceProfileNameAndTypes=MCReplica_High,Windows
+DeviceProfileNameAndTypes=MCReplica_Epic,Windows
+DeviceProfileNameAndTypes=MCReplica_Cinematic,Windows


; ===========================================================================
; The floor for an unmeasured machine
; ===========================================================================
; "Windows" is the one name the Windows selector always returns, so this is
; the section that actually gets applied on a normal launch. The tier cvars
; duplicate the Medium row of DefaultScalability.ini on purpose: they are the
; belt to that file's braces, and they hold even if the scalability ini is
; overridden by a platform ini during cook.
[Windows DeviceProfile]
DeviceType=Windows
+CVars=sg.ResolutionQuality=71.000000
+CVars=sg.ViewDistanceQuality=1
+CVars=sg.AntiAliasingQuality=1
+CVars=sg.ShadowQuality=1
+CVars=sg.GlobalIlluminationQuality=1
+CVars=sg.ReflectionQuality=1
+CVars=sg.PostProcessQuality=1
+CVars=sg.TextureQuality=1
+CVars=sg.EffectsQuality=1
+CVars=sg.FoliageQuality=1
+CVars=sg.ShadingQuality=1
; Smallest pool that still holds the block atlas, for the same reason the
; scalability ini does: these are shared-RAM iGPUs as often as not.
+CVars=r.Streaming.PoolSize=512
+CVars=r.Nanite=1
+CVars=r.Nanite.Streaming.StreamingPoolSize=256
+CVars=r.ViewDistanceScale=0.7


; ===========================================================================
; Selectable tiers
; ===========================================================================
; These do not get chosen automatically -- there is no Windows mechanism that
; would. They exist to be selected by name, which is what happens when:
;
;   * apply_quality.py decides a tier at runtime and wants the profile's cvars
--   * a user launches with -MCReplicaTier=Low on the command line
;   * a QA machine is locked to a tier for comparable captures
;
; Each inherits Windows, so it only has to state what differs. Only genuinely
; tier-specific cvars belong here; per-group detail lives in
; DefaultScalability.ini, which is the single place that owns it.

[MCReplica_Low DeviceProfile]
BaseProfileName=Windows
+CVars=sg.ResolutionQuality=50.000000
+CVars=sg.ViewDistanceQuality=0
+CVars=sg.AntiAliasingQuality=0
+CVars=sg.ShadowQuality=0
+CVars=sg.GlobalIlluminationQuality=0
+CVars=sg.ReflectionQuality=0
+CVars=sg.PostProcessQuality=0
+CVars=sg.TextureQuality=0
+CVars=sg.EffectsQuality=0
+CVars=sg.FoliageQuality=0
+CVars=sg.ShadingQuality=0
+CVars=r.Streaming.PoolSize=256
+CVars=r.Streaming.MaxTempMemoryAllowed=32
+CVars=r.Nanite.MaxPixelsPerEdge=4
+CVars=r.Nanite.Streaming.StreamingPoolSize=128
+CVars=r.ViewDistanceScale=0.4
; Lumen off, but Nanite stays on -- see DefaultScalability.ini for why.
+CVars=r.DynamicGlobalIlluminationMethod=0
+CVars=r.Lumen.Reflections.Allow=0

[MCReplica_Medium DeviceProfile]
BaseProfileName=Windows
+CVars=sg.ViewDistanceQuality=1
+CVars=sg.AntiAliasingQuality=1
+CVars=sg.ShadowQuality=1
+CVars=sg.GlobalIlluminationQuality=1
+CVars=sg.ReflectionQuality=1
+CVars=sg.PostProcessQuality=1
+CVars=sg.TextureQuality=1
+CVars=sg.EffectsQuality=1
+CVars=sg.FoliageQuality=1
+CVars=sg.ShadingQuality=1
+CVars=r.ViewDistanceScale=0.7

[MCReplica_High DeviceProfile]
BaseProfileName=Windows
+CVars=sg.ViewDistanceQuality=2
+CVars=sg.AntiAliasingQuality=2
+CVars=sg.ShadowQuality=2
+CVars=sg.GlobalIlluminationQuality=2
+CVars=sg.ReflectionQuality=2
+CVars=sg.PostProcessQuality=2
+CVars=sg.TextureQuality=2
+CVars=sg.EffectsQuality=2
+CVars=sg.FoliageQuality=2
+CVars=sg.ShadingQuality=2
+CVars=r.Streaming.PoolSize=1024
+CVars=r.Nanite.Streaming.StreamingPoolSize=512
+CVars=r.ViewDistanceScale=1.0

[MCReplica_Epic DeviceProfile]
BaseProfileName=Windows
+CVars=sg.ViewDistanceQuality=3
+CVars=sg.AntiAliasingQuality=3
+CVars=sg.ShadowQuality=3
+CVars=sg.GlobalIlluminationQuality=3
+CVars=sg.ReflectionQuality=3
+CVars=sg.PostProcessQuality=3
+CVars=sg.TextureQuality=3
+CVars=sg.EffectsQuality=3
+CVars=sg.FoliageQuality=3
+CVars=sg.ShadingQuality=3
+CVars=r.Streaming.PoolSize=2048
+CVars=r.Nanite.Streaming.StreamingPoolSize=512
+CVars=r.ViewDistanceScale=1.0

[MCReplica_Cinematic DeviceProfile]
BaseProfileName=Windows
+CVars=sg.ViewDistanceQuality=4
+CVars=sg.AntiAliasingQuality=4
+CVars=sg.ShadowQuality=4
+CVars=sg.GlobalIlluminationQuality=4
+CVars=sg.ReflectionQuality=4
+CVars=sg.PostProcessQuality=4
+CVars=sg.TextureQuality=4
+CVars=sg.EffectsQuality=4
+CVars=sg.FoliageQuality=4
+CVars=sg.ShadingQuality=4
+CVars=r.Streaming.PoolSize=4096
+CVars=r.Nanite.Streaming.StreamingPoolSize=1024
+CVars=r.ViewDistanceScale=1.2
; NOT sg.ResolutionQuality=150. That is clamped: sg.ResolutionQuality feeds
; r.ScreenPercentage through SetResolutionQualityLevel, which clamps to
; Scalability::MaxResolutionScale == 100 (Scalability.h:185). Supersampling has
; to go through the screen-percentage cvar directly, which is a runtime concern
; and therefore belongs in apply_quality.py, not here.


; ===========================================================================
; RHI-specific profiles
; ===========================================================================
; The Windows selector will prefer "<Platform>_<RHIModuleName>" over the bare
; platform name if a section of that name exists -- it builds the candidate as
; ProfileName + "_" + GetSelectedDynamicRHIModuleName() and uses it only on a
; hit, otherwise it falls back to plain "Windows"
; (WindowsDeviceProfileSelectorModule.cpp, GetRuntimeDeviceProfileName).
;
; The module name is the RHI's, so the section is "Windows_D3D12" on D3D12 and
; "Windows_Vulkan" on Vulkan -- NOT "Windows_DX12". Getting that string wrong
; is harmless in the safe direction: the lookup misses, and the machine lands
; on [Windows DeviceProfile] above, which is the Medium floor we want anyway.
;
; We deliberately do not declare one. Everything this project needs is
; RHI-independent, and a wrong guess here buys nothing while making the file
; look like it configures something it does not. If a future RHI-specific need
; appears -- shader permutation limits, Nanite SM6 requirements -- the section
; goes here with the name the RHI actually reports.

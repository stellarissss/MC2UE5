; Project packaging settings.

[/Script/UnrealEd.ProjectPackagingSettings]
; The terrain material and its textures are loaded BY PATH at runtime, from the
; code that builds the terrain procedurally (AMCFrameCaptureGameMode::
; BuildProceduralTerrain). Nothing in the level references them, so the cooker
; drops them as unreferenced -- and a material that is not in the package is a
; material the game cannot load. That is what left the campus rendering with the
; engine's default grey grid material.
+DirectoriesToAlwaysCook=(Path="/Game/MC/Materials")
+DirectoriesToAlwaysCook=(Path="/Game/MC/Textures")
; The CC0 block materials and their PBR textures. Same failure mode as above and
; just as silent: without this the 1.17M voxel blocks render with the engine
; default material, which reads as a blue checkerboard rather than an error.
+DirectoriesToAlwaysCook=(Path="/Game/MC/CC0")
; The shared unit cube every block instance draws.
+DirectoriesToAlwaysCook=(Path="/Game/Meshes")

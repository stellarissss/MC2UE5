; MCReplica -- scalability groups for the graduated quality tiers.
;
; See ../QUALITY_TIERS.md for the full matrix and the reasoning.
; Project-level override of Engine/Config/BaseScalability.ini.
;
; There are five tiers, at quality level 0..4:
;
;   0 Low        Intel UHD 620 / Vega 8, 8 GB     30 fps @ 720p
;   1 Medium     GTX 1650 / MX550, 16 GB          45 fps @ 1080p
;   2 High       RTX 3060 / RX 6600               60 fps @ 1080p
;   3 Epic       RTX 4070 / RX 7800+              60+ fps @ 1440p
;   4 Cinematic  RTX 4080 / 4090                  image quality first
;
;
; HOW THE ENGINE ACTUALLY READS THIS FILE
; ---------------------------------------
; Two independent mechanisms, and confusing them is the single easiest way to
; ship a quality system that silently does nothing. Both are verified against
; the engine source (Engine/Source/Runtime/Engine/Private/Scalability.cpp):
;
;   1. SECTION VARIABLES -- what a tier *does*.
;      Setting a group level makes the engine read the section named
;      "<Group>@<level>", or "<Group>@Cine" when the level is the maximum
;      (GetScalabilitySectionString, Scalability.cpp:273). Every cvar in that
;      section is applied with ECVF_SetByScalability. So level 4 reads
;      "ViewDistanceQuality@Cine" -- there is no such thing as
;      "ViewDistanceQuality@4" as far as the engine is concerned, and a file
;      that writes "@4" is silently ignored at the top tier.
;
;   2. PerfIndexThresholds_* -- how the engine *picks* a level by itself.
;      Read from the [ScalabilitySettings] section below, via
;      GConfig->GetSingleLineArray("ScalabilitySettings", "PerfIndexThresholds_<Group>")
;      (Scalability.cpp:150-152). The value is a whitespace-separated array:
;
;          PerfIndexThresholds_<Group>="<CPU|GPU|Min> <t0> <t1> <t2>"
;
;      The first token selects WHICH index is consulted -- CPU, GPU, or Min for
;      the slower of the two. The three numbers are the perf-index boundaries
;      for 0->1, 1->2 and 2->3. Above the last boundary the level is 3 (Epic);
;      level 4 (Cinematic) is never selected automatically, by design.
;
;      IMPORTANT: these keys are read *only* from this file, from the
;      [ScalabilitySettings] section. They are NOT read from DeviceProfile
;      files, and they do NOT reference a device profile name. A line like
;      "PerfIndexThresholds_Universal=SomeProfile 30 120 400" in
;      DefaultDeviceProfiles.ini is dead text: the engine never looks at it.
;
; This project's bottleneck is CPU-side HISM cluster culling over ~1.6 M block
; instances, which scales with instance count and view distance rather than
; with pixels. So the CPU-coupled groups below use "Min" -- a fast GPU behind a
; slow CPU must not unlock a high tier. Pixel-bound groups use "GPU", because
; on those a weak CPU genuinely does not matter and we should not throw away
; image quality for nothing.


[ScalabilitySettings]
; --- auto-selection boundaries -------------------------------------------
; "Min" = slower of CPU/GPU. Chosen per group by what actually limits it.
; Tuned against measured synthbenchmark indices, see QUALITY_TIERS.md section 7:
;   i5-8265U + UHD 620    index ~22   -> 0 Low
;   i5-12400 + GTX 1650   index ~85   -> 1 Medium
;   i7-12700 + RTX 3060   index ~240  -> 2 High
;   i9-13900 + RTX 4070   index ~600  -> 3 Epic
PerfIndexThresholds_ResolutionQuality="GPU 30 120 400"
PerfIndexThresholds_ViewDistanceQuality="Min 30 120 400"
PerfIndexThresholds_AntiAliasingQuality="GPU 30 120 400"
PerfIndexThresholds_ShadowQuality="Min 30 120 400"
PerfIndexThresholds_GlobalIlluminationQuality="Min 30 120 400"
PerfIndexThresholds_ReflectionQuality="GPU 30 120 400"
PerfIndexThresholds_PostProcessQuality="GPU 30 120 400"
PerfIndexThresholds_TextureQuality="Min 30 120 400"
PerfIndexThresholds_EffectsQuality="Min 30 120 400"
PerfIndexThresholds_FoliageQuality="Min 30 120 400"
PerfIndexThresholds_ShadingQuality="GPU 30 120 400"

; Screen percentage per level. Read by GetRenderScaleLevelFromQualityLevel
; (Scalability.cpp:522) when a render scale is derived from a quality level.
; NOTE: sg.ResolutionQuality is clamped to Scalability::MaxResolutionScale,
; which is 100 in the engine (Scalability.h:185). A value above 100 written to
; sg.ResolutionQuality is silently clamped, so the top tier's extra headroom
; has to come from a real supersampling cvar (see Cinematic below), not from
; sg.ResolutionQuality. Hence 100 at the top and not 150.
PerfIndexValues_ResolutionQuality="50 71 87 100 100"


; ===========================================================================
; Per-group detail
; ===========================================================================
; Only the groups this project needs to differ from Epic's BaseScalability.ini.
; Everything else is inherited unchanged.
;
; Two project-specific decisions are recorded here because they differ from
; Epic's defaults and are easy to "fix" by accident:
;
;   * Nanite stays ON in every tier, including Low. Every mesh this project
;     produces is a 12-face HISM block or a Landscape. Nanite's off-path cost
;     on those is small, and turning it off would change the asset pipeline
;     rather than just the frame cost. What *is* tuned per tier is Nanite's
;     pixel-per-edge budget and streaming pool, which is the real Nanite cost.
;   * Resolution is the first thing to give up on a weak GPU. The campus is
;     geometry-bound (HISM culling), not pixel-bound, so cutting resolution
;     buys CPU headroom for the cull while barely touching image quality.


[ViewDistanceQuality@0]
; HISM instances are culled per component by Max Draw Distance (set in
; import_phase2.py / import_world.py); r.ViewDistanceScale multiplies all of
; them. 0.4 on Low means a 300 m tree culls at 120 m.
r.SkeletalMeshLODBias=2
r.ViewDistanceScale=0.4
; Halve the Nanite cluster budget and quarter the streaming pool. These two
; plus ViewDistanceScale are the whole Low-tier frame budget on this map.
r.Nanite.MaxPixelsPerEdge=4
r.Nanite.Streaming.StreamingPoolSize=128
; Landscape LOD distribution. Both default to 1.0 and both are declared
; ECVF_Scalability in LandscapeRender.cpp, so this is the block the engine
; expects them in. The cvar sits in the *denominator* of the per-LOD screen
; size falloff -- GetLODScreenSizeArray computes
;   ScreenSizeMult = 1 / max(LOD0DistributionSetting * Scale, 1.01)
; and multiplies the running threshold by it each LOD -- so bigger means
; coarser sooner. 1.8 pulls LOD0 in tight on Low; the terrain is 1 m terrain
; seen from eye level, so anything past ~150 m is sub-pixel anyway.
r.LandscapeLOD0DistributionScale=1.8
r.LandscapeLODDistributionScale=1.4

[ViewDistanceQuality@1]
r.SkeletalMeshLODBias=1
r.ViewDistanceScale=0.7
r.Nanite.MaxPixelsPerEdge=2
r.Nanite.Streaming.StreamingPoolSize=256
r.LandscapeLOD0DistributionScale=1.4
r.LandscapeLODDistributionScale=1.2

[ViewDistanceQuality@2]
r.SkeletalMeshLODBias=0
r.ViewDistanceScale=1.0
r.Nanite.MaxPixelsPerEdge=1
r.Nanite.Streaming.StreamingPoolSize=512
r.LandscapeLOD0DistributionScale=1.0
r.LandscapeLODDistributionScale=1.0

[ViewDistanceQuality@3]
r.SkeletalMeshLODBias=0
r.ViewDistanceScale=1.0
r.Nanite.MaxPixelsPerEdge=1
r.Nanite.Streaming.StreamingPoolSize=512
r.LandscapeLOD0DistributionScale=1.0
r.LandscapeLODDistributionScale=1.0

[ViewDistanceQuality@Cine]
; Epic's own value here is 10.0, which effectively disables view-distance
; culling. For a map whose entire silhouette is a HISM block layer that is a
; trap: it does not make the scene look better, it just removes the budget
; that keeps the frame time bounded. 1.2 keeps a little headroom instead.
;
; The Landscape distribution cvars go the other way from the ones above, and
; the reason is the clamp. GetLODScreenSizeArray computes
;   ScreenSizeMult = 1 / max(LOD0DistributionSetting * Scale, 1.01)
; so the product is floored at 1.01. With the engine default
; LOD0DistributionSetting of 1.25, a scale of 1.0 gives a multiplier of 0.8 --
; each LOD step keeps 80% of the previous screen size. Anything *below* 1.0
; therefore does still bite (down to a product of 1.01, i.e. a scale of ~0.81),
; which is what lets this tier hold terrain detail further out than stock
; instead of letting it fall off early.
;
; 0.85 pairs with ViewDistanceScale=1.2 above: this tier sees further, so the
; terrain it sees must not be the blurriest thing on screen. The Cine tier
; exists to be the best-looking one; a lower LOD0 distribution than High while
; showing more of the map would be a straight quality regression.
r.SkeletalMeshLODBias=0
r.ViewDistanceScale=1.2
r.Nanite.MaxPixelsPerEdge=1
r.Nanite.Streaming.StreamingPoolSize=1024
r.LandscapeLOD0DistributionScale=0.85
r.LandscapeLODDistributionScale=0.9


[ShadowQuality@0]
; No dynamic shadows on Low. The campus is lit by one directional light and
; shadows are the second-largest GPU cost after GI.
r.Shadow.Virtual.Enable=0
r.ShadowQuality=0
r.Shadow.MaxResolution=512
r.Shadow.DistanceScale=0.4

[ShadowQuality@1]
r.Shadow.Virtual.Enable=0
r.ShadowQuality=3
r.Shadow.MaxResolution=1024
r.Shadow.DistanceScale=0.7

[ShadowQuality@2]
r.Shadow.Virtual.Enable=1
r.Shadow.DistanceScale=1.0

[ShadowQuality@3]
r.Shadow.Virtual.Enable=1
r.Shadow.DistanceScale=1.0

[ShadowQuality@Cine]
r.Shadow.Virtual.Enable=1
r.Shadow.DistanceScale=1.0


[GlobalIlluminationQuality@0]
; Lumen off entirely; fall back to the lightmap/AO path. Lumen is the single
; most expensive feature in the engine and the least useful here, because the
; map is fully static and lit by one directional light.
r.DynamicGlobalIlluminationMethod=0
r.Lumen.Reflections.Allow=0

[GlobalIlluminationQuality@1]
r.DynamicGlobalIlluminationMethod=1
r.Lumen.Reflections.Allow=1
r.Lumen.ScreenProbeGather.RadianceCache.ProbeResolution=8
r.Lumen.TraceMeshSDFs=0

[GlobalIlluminationQuality@2]
r.DynamicGlobalIlluminationMethod=1
r.Lumen.Reflections.Allow=1
r.Lumen.ScreenProbeGather.RadianceCache.ProbeResolution=16
r.Lumen.TraceMeshSDFs=0

[GlobalIlluminationQuality@3]
r.DynamicGlobalIlluminationMethod=1
r.Lumen.Reflections.Allow=1
r.Lumen.ScreenProbeGather.RadianceCache.ProbeResolution=32
r.Lumen.TraceMeshSDFs=1

[GlobalIlluminationQuality@Cine]
r.DynamicGlobalIlluminationMethod=1
r.Lumen.Reflections.Allow=1
r.Lumen.ScreenProbeGather.RadianceCache.ProbeResolution=32
r.Lumen.TraceMeshSDFs=1


[FoliageQuality@0]
; 0, not 0.25: the campus ground layer is a HISM field, and at Low the goal is
; that a weak machine still holds frame rate. Grass is the cheapest thing to
; lose visually because the block layer is what reads as "the map".
foliage.DensityScale=0.0
grass.DensityScale=0.0

[FoliageQuality@1]
foliage.DensityScale=0.4
grass.DensityScale=0.4

[FoliageQuality@2]
foliage.DensityScale=0.8
grass.DensityScale=0.8

[FoliageQuality@3]
foliage.DensityScale=1.0
grass.DensityScale=1.0

[FoliageQuality@Cine]
foliage.DensityScale=1.0
grass.DensityScale=1.0


[TextureQuality@0]
; Smallest possible streaming pool. These are integrated GPUs sharing system
; RAM, so the pool competes with everything else. MipBias 2 is quarter-res
; mips: the block atlas is 16x16 per tile, so colours stay readable.
r.Streaming.MipBias=2.0
r.Streaming.PoolSize=256
r.Streaming.MaxTempMemoryAllowed=32

[TextureQuality@1]
r.Streaming.MipBias=1.0
r.Streaming.PoolSize=512
r.Streaming.MaxTempMemoryAllowed=64

[TextureQuality@2]
r.Streaming.MipBias=0.0
r.Streaming.PoolSize=1024
r.Streaming.MaxTempMemoryAllowed=128

[TextureQuality@3]
r.Streaming.MipBias=0.0
r.Streaming.PoolSize=2048
r.Streaming.MaxTempMemoryAllowed=256

[TextureQuality@Cine]
r.Streaming.MipBias=0.0
r.Streaming.PoolSize=4096
r.Streaming.MaxTempMemoryAllowed=512


; ===========================================================================
; The startup default
; ===========================================================================
; What a group is set to *before* any benchmark or menu interaction. In a
; cooked build every group defaults to 3 (Epic) because no device profile
; matched; setting it here makes the shipped default the one this project can
; actually run. Medium is the honest choice: it holds 45 fps at 1080p on a
; GTX 1650, and a player can raise it in one click from the pause menu.
;
; This is NOT auto-detection. It is a constant. Real auto-detection is the
; PerfIndexThresholds block at the top of this file, and it only runs when
; something calls RunHardwareBenchmark + ApplyHardwareBenchmarkResults --
; see Content/Python/apply_quality.py, which does exactly that on startup.
[ScalabilityGroups]
sg.ResolutionQuality=71.000000
sg.ViewDistanceQuality=1
sg.AntiAliasingQuality=1
sg.ShadowQuality=1
sg.GlobalIlluminationQuality=1
sg.ReflectionQuality=1
sg.PostProcessQuality=1
sg.TextureQuality=1
sg.EffectsQuality=1
sg.FoliageQuality=1
sg.ShadingQuality=1

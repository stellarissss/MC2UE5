[/Script/Engine.RendererSettings]
; ---- Nanite ----------------------------------------------------------------
; MC blocks are plain opaque cubes; tessellation is not required.
r.Nanite=True
r.Nanite.ProjectEnabled=True
; Keep the aggressive (lower-error) setting so a 1 m cube is never simplified:
; on a cube, faceting reads as a rendering error rather than a LOD trade-off.
r.Nanite.MaxPixelsPerEdge=1.0

; ---- Lumen (realistic global illumination) ---------------------------------
; Explicit rather than relying on engine defaults: the whole point of the
; render rework is a realistic look, and GI/reflection mode is what carries it.
;   1 = Lumen   (0 = none, 2 = screen space)
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
; Software ray tracing: broadest hardware support, and this scene is a dense
; field of small cubes where surface-cache quality matters more than trace
; precision. Hardware RT can be enabled later as a quality tier.
r.Lumen.HardwareRayTracing=0
r.Lumen.TraceMeshSDFs=0
r.Lumen.ScreenProbeGather.DownsampleFactor=32
; Lumen traces the distance field of the scene, which must therefore be built.
; Mesh distance fields are OFF. The level still carries 1,041 legacy ISM
; clusters holding 1,171,144 instances, and mesh distance fields are built per
; instance: with this many, startup stalls indefinitely on the loading screen's
; "Preparing Mesh Distance Fields (2)" and never presents a frame, which makes
; every visual check impossible. Nothing here needs them -- they exist for
; DFAO and for Lumen's mesh-SDF tracing, and Lumen still runs with the global
; SDF. Re-enable only after the legacy voxel layer is retired.
r.GenerateMeshDistanceFields=False
; Matches the setting above: tracing mesh SDFs requires distance fields that are
; no longer generated, and asking for both just stalls on the same work.

; ---- Shadows ---------------------------------------------------------------
; Virtual shadow maps: correct shadowing for the voxel field at 1 m block
; scale, where a single cascade could not hold the required resolution.
r.Shadow.Virtual.Enable=1

; ---- Anti-aliasing ---------------------------------------------------------
; TSR (4) resolves the dense block edges far better than TAA on this scene.
r.AntiAliasingMethod=4

; ---- Defaults that the realistic look depends on ---------------------------
r.DefaultFeature.AutoExposure=1
r.DefaultFeature.Bloom=1
r.DefaultFeature.AmbientOcclusion=1
r.DefaultFeature.MotionBlur=0

